<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="stdd-draw-template" content="5">
  <title>STDD Draw</title>
  <link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.0.4/dist/style.css">
  <style>
    :root {
      --ink: #172033;
      --muted: #69748a;
      --paper: #ffffff;
      --canvas: #f4f6fa;
      --line: #dfe3ea;
      --line-strong: #cfd5df;
      --accent: #5b4cf0;
      --accent-strong: #4435d6;
      --danger: #d64562;
      --success: #259b73;
      --panel: rgba(255, 255, 255, .94);
      --shadow-sm: 0 8px 24px rgba(23, 32, 51, .08);
      --shadow-lg: 0 24px 70px rgba(23, 32, 51, .18);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    #root {
      width: 100%;
      height: 100%;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .42;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-columns: 100%;
      width: 100%;
      height: 100%;
      min-width: 780px;
      overflow: hidden;
    }

    .sidebar {
      position: absolute;
      z-index: 30;
      top: 16px;
      bottom: 16px;
      left: 16px;
      width: 286px;
      overflow: auto;
      padding: 22px 18px 90px;
      border: 1px solid rgba(216, 221, 230, .95);
      border-radius: 24px;
      background: rgba(255, 255, 255, .97);
      box-shadow: var(--shadow-lg);
      transform: translateX(calc(-100% - 32px));
      opacity: 0;
      transition: transform .24s ease, opacity .2s ease;
      backdrop-filter: blur(18px);
    }

    .app.library-open .sidebar {
      transform: translateX(0);
      opacity: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      color: #fff;
      background: #171b24;
      box-shadow: 0 9px 22px rgba(23, 27, 36, .18);
      font-weight: 900;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #6b5de7;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: 21px;
      letter-spacing: -.035em;
    }

    h2 {
      margin-bottom: 5px;
      font-size: 20px;
      letter-spacing: -.03em;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .sidebar-copy {
      margin: 18px 2px 0;
    }

    .search {
      width: 100%;
      margin: 14px 0 11px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      color: var(--ink);
      background: #fff;
      transition: .18s;
    }

    .search:focus {
      border-color: #8d82f3;
      box-shadow: 0 0 0 4px rgba(91, 76, 240, .10);
    }

    .draw-list {
      display: grid;
      gap: 8px;
    }

    .improvement-list {
      display: grid;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .improvement-heading {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .improvement-item {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ded9ff;
      border-radius: 13px;
      color: var(--ink);
      background: #fbfaff;
      text-align: left;
      cursor: pointer;
    }

    .improvement-item.active {
      border-color: #8d82f3;
      box-shadow: 0 0 0 3px rgba(91, 76, 240, .10);
    }

    .improvement-editor {
      width: min(920px, calc(100% - 48px));
      max-height: calc(100% - 120px);
      overflow: auto;
      margin: 72px auto 48px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow-lg);
    }

    .improvement-progress {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .improvement-question {
      margin: 12px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .improvement-question label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .improvement-question p {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .improvement-question select,
    .improvement-question textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }

    .improvement-question textarea {
      min-height: 84px;
      resize: vertical;
    }

    .new-draw {
      width: 100%;
      margin: 14px 0 4px;
      padding: 12px 13px;
      border: 1px dashed #aaa1f5;
      border-radius: 14px;
      color: #4f41d6;
      background: #f6f4ff;
      font-weight: 850;
      text-align: left;
      transition: .18s;
    }

    .new-draw:hover {
      border-color: #7769e8;
      background: #efedff;
      transform: translateY(-1px);
    }

    .draw-item {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: #fff;
      text-align: left;
      transition: .18s;
    }

    .draw-item:hover,
    .draw-item.active {
      transform: translateY(-1px);
      border-color: #9187ef;
      box-shadow: 0 10px 28px rgba(69, 54, 206, .11);
    }

    .draw-item.active {
      background: linear-gradient(135deg, #f8f7ff, #fff);
    }

    .draw-item strong,
    .draw-item small {
      display: block;
    }

    .draw-item small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .status {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 35;
      max-width: min(430px, calc(100vw - 36px));
      margin: 0;
      padding: 10px 13px;
      border: 1px solid rgba(218, 223, 232, .95);
      border-radius: 999px;
      color: #5f687a;
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow-sm);
      font-size: 11px;
      line-height: 1.35;
      backdrop-filter: blur(14px);
    }

    .workspace {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--canvas);
    }

    .toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toolbar>* {
      pointer-events: auto;
    }

    .toolbar .title {
      flex: 1;
      min-width: 160px;
      overflow: hidden;
      padding: 11px 15px;
      border: 1px solid rgba(216, 221, 230, .92);
      border-radius: 15px;
      color: #30394d;
      background: var(--panel);
      box-shadow: var(--shadow-sm);
      font-size: 13px;
      font-weight: 780;
      text-overflow: ellipsis;
      white-space: nowrap;
      backdrop-filter: blur(16px);
    }

    .tool-group {
      display: flex;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(216, 221, 230, .92);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(16px);
    }

    .toolbar button {
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #4b566b;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toolbar button:hover:not(:disabled) {
      color: #171d2a;
      background: #f0f2f6;
    }

    .toolbar button.primary {
      color: #fff;
      background: #171b24;
      box-shadow: 0 7px 18px rgba(23, 27, 36, .18);
    }

    .toolbar button.active {
      color: #fff;
      background: var(--accent);
    }

    .toolbar button.reorganize {
      color: #4f41d6;
      background: #f0eeff;
    }

    .toolbar button.danger:hover:not(:disabled) {
      color: #bb304f;
      background: #fff0f3;
    }

    .react-flow-stage {
      width: 100%;
      height: 100%;
    }

    .react-flow__edge-textwrapper {
      z-index: 8;
      pointer-events: none;
    }

    .react-flow__edge-text {
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 8px;
      stroke-linejoin: round;
    }

    /* Custom React Flow Nodes */
    .custom-flow-node {
      position: relative;
      padding: 18px 16px;
      min-width: 250px;
      max-width: 320px;
      border-radius: 20px;
      border: 1.5px solid rgba(23, 32, 51, .14);
      filter: drop-shadow(0 12px 18px rgba(23, 32, 51, .12));
      transition: filter .15s, border-color .15s;
    }

    .custom-flow-node.selected {
      border: 3px solid #171b24;
      filter: drop-shadow(0 16px 23px rgba(23, 32, 51, .17));
    }

    .node-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .node-header-pill {
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, .3);
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(23, 32, 51, .10);
    }

    .node-header-id {
      margin-left: auto;
      font-size: 9px;
      font-weight: 850;
      opacity: .7;
    }

    .inline-node-input,
    .inline-node-textarea {
      width: 100%;
      border: 1px solid rgba(23, 32, 51, .3);
      border-radius: 8px;
      outline: none;
      padding: 5px 7px;
      color: inherit;
      background: rgba(255, 255, 255, .72);
    }

    .inline-node-input {
      font-size: 15px;
      font-weight: 900;
    }

    .inline-node-textarea {
      min-height: 48px;
      resize: vertical;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.4;
    }

    .node-body-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -.02em;
      margin-bottom: 6px;
      cursor: text;
    }

    .node-body-desc {
      font-size: 11px;
      font-weight: 650;
      opacity: .8;
      line-height: 1.4;
      cursor: text;
    }

    .node-divider-line {
      border-top: 1px solid rgba(23, 32, 51, .15);
      margin: 10px 0;
    }

    .node-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      font-weight: 800;
    }

    .node-footer-subdraw {
      cursor: pointer;
      text-decoration: underline;
    }

    .node-footer-subdraw-icon {
      font-weight: 900;
      margin-left: 3px;
    }

    /* Floating Action Circles above Node */
    .node-action-container {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      pointer-events: auto;
      z-index: 10;
    }

    .action-circle-btn {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 6px rgba(23, 32, 51, .22);
      cursor: pointer;
      transition: transform .15s;
    }

    .action-circle-btn:hover {
      transform: scale(1.22);
    }

    .action-circle-btn.questions {
      display: flex;
      gap: 4px;
      width: auto;
      min-width: 22px;
      padding: 0 3px;
      border-radius: 12px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .question-count {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      box-shadow: 0 3px 6px rgba(23, 32, 51, .22);
    }

    .question-count.answered {
      background: #259b73;
    }

    .question-count.unanswered {
      background: #d64562;
    }

    .question-summary {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .question-summary .question-count {
      display: inline-grid;
      flex: 0 0 auto;
      width: 25px;
      height: 25px;
      font-size: 10px;
    }

    /* Custom Handles styling */
    .custom-flow-node .react-flow__handle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      background: #171b24;
      box-shadow: 0 4px 7px rgba(23, 27, 36, .35);
      transition: transform .15s;
    }

    .custom-flow-node .react-flow__handle:hover {
      transform: scale(1.28);
    }

    .custom-flow-node .react-flow__handle-left {
      left: -7px;
    }

    .custom-flow-node .react-flow__handle-right {
      right: -7px;
    }

    .custom-flow-node .loop-handle {
      width: 10px;
      height: 10px;
      opacity: 0;
      pointer-events: none;
    }

    .custom-flow-node .loop-handle-bottom {
      bottom: -5px;
    }

    .custom-flow-node .loop-handle-top {
      top: -5px;
    }

    .loop-edge-label {
      position: absolute;
      padding: 4px 6px;
      border: 1px solid currentColor;
      border-radius: 5px;
      background: rgba(255, 255, 255, .94);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    /* Popup Dialog Form UI styling */
    .app-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      max-height: calc(100vh - 32px);
      margin: 0;
      overflow: auto;
      transform: translate(-50%, -50%);
      width: min(540px, calc(100vw - 32px));
      padding: 0;
      border: 0;
      border-radius: 22px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 30px 90px rgba(23, 32, 51, .28);
    }

    .app-dialog::backdrop {
      background: rgba(20, 25, 36, .35);
      backdrop-filter: blur(5px);
    }

    .dialog-content {
      padding: 22px;
    }

    .dialog-copy {
      margin: 4px 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .dialog-fields {
      display: grid;
      gap: 11px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .dialog-actions button {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #4d586c;
      background: #fff;
      font-size: 11px;
      font-weight: 850;
    }

    .dialog-actions button:hover {
      background: #f3f4f7;
    }

    .dialog-actions .primary {
      color: #fff;
      border-color: #171b24;
      background: #171b24;
    }

    .dialog-actions .danger {
      color: #b62f4d;
      border-color: #f0c8d1;
      background: #fff4f6;
    }

    .editor-field {
      display: grid;
      gap: 6px;
    }

    .editor-field label {
      color: #687286;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .editor-field input,
    .editor-field textarea,
    .editor-field select {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
    }

    .editor-field textarea {
      min-height: 72px;
      resize: vertical;
    }

    .editor-field input:focus,
    .editor-field textarea:focus,
    .editor-field select:focus {
      border-color: #8d82f3;
      box-shadow: 0 0 0 4px rgba(91, 76, 240, .09);
    }

    .canvas-hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 8;
      max-width: calc(100vw - 500px);
      padding: 9px 12px;
      border: 1px solid rgba(216, 221, 230, .9);
      border-radius: 999px;
      color: #6c7586;
      background: rgba(255, 255, 255, .88);
      box-shadow: var(--shadow-sm);
      font-size: 10px;
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    /* Questions Dialog custom cards */
    .question-list {
      display: grid;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .question-card {
      display: grid;
      gap: 7px;
      padding: 11px;
      border: 1px solid #e5e8ee;
      border-radius: 13px;
      background: #fafbfc;
    }

    .question-card label {
      color: #6b7486;
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .question-card p {
      margin: 0;
      color: #293247;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.42;
    }

    .question-card select,
    .question-card textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 11px;
    }

    .dirty-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 76, 240, .12);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
        "@xyflow/react": "https://esm.sh/@xyflow/react@12.0.4?external=react,react-dom,react%2Fjsx-runtime"
      }
    }
  </script>

  <!-- React & React Flow app injection module -->
  <script type="module">
    import React, { useState, useEffect, useCallback, useMemo, useRef } from 'react';
    import ReactDOM from 'react-dom/client';
    import {
      ReactFlow,
      ReactFlowProvider,
      MiniMap,
      Controls,
      Background,
      useNodesState,
      useEdgesState,
      addEdge,
      MarkerType,
      Position,
      Handle,
      useReactFlow,
      BaseEdge,
      EdgeLabelRenderer
    } from '@xyflow/react';

    const EDGE_CONDITIONS = { 1: 'então', 2: 'ou', 3: 'se' };
    const DEFAULT_CONDITION = 1;

    // Helper functions
    const esc = value => String(value ?? '');
    function wrapText(value, maxCharacters) {
      const words = esc(value).trim().split(/\s+/).filter(Boolean);
      const lines = [];
      words.forEach(word => {
        const current = lines.at(-1);
        if (!current || `${current} ${word}`.length > maxCharacters) lines.push(word);
        else lines[lines.length - 1] = `${current} ${word}`;
      });
      return lines.length ? lines : [''];
    }

    async function getJson(url) {
      const requestUrl = window.location.protocol === 'file:'
        ? new URL(`/.stdd/${url}`, apiOrigin()).toString()
        : url;
      const response = await fetch(requestUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function apiOrigin() {
      if (window.STDD_API_ORIGIN) return String(window.STDD_API_ORIGIN).replace(/\/$/, '');
      if (window.location.protocol === 'file:' || window.location.port === '5500') return 'http://127.0.0.1:8765';
      return window.location.origin;
    }

    function slugify(value) {
      return String(value || 'novo-desenho').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'novo-desenho';
    }

    function uniqueDrawId(title, index) {
      const base = slugify(title || 'novo-desenho');
      const used = new Set(index.map(item => String(item.id)));
      let candidate = base;
      let suffix = 2;
      while (used.has(candidate)) {
        candidate = `${base}-${suffix}`;
        suffix += 1;
      }
      return candidate;
    }

    function nextNumericId(items) {
      const ids = items.map(item => Number(item.id)).filter(id => Number.isInteger(id) && id >= 0);
      return ids.length ? Math.max(...ids) + 1 : 1;
    }

    function nodeColor(kind, drawRef) {
      if (kind === 'decision') return '#78BDF2';
      if (kind === 'database') return '#91D8C1';
      if (drawRef) return '#F1C8EC';
      if (kind === 'note') return '#FFDEA0';
      return '#FFC83D';

        try {
          const endpoint = new URL(`/__stdd/api/draws/${encodeURIComponent(current.id)}.json`, apiOrigin());
          const response = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedPayload)
          });
          const responseText = await response.text();
          let result = {};
          if (responseText.trim()) {
            try {
              result = JSON.parse(responseText);
            } catch (_) {
              throw new Error(`resposta inválida do servidor (HTTP ${response.status})`);
            }
          }
          if (!response.ok) throw new Error(result.error || `falha ao salvar (HTTP ${response.status})`);
          setDirty(false);
          setStatus('Desenho salvo com sucesso.');
          loadIndex(false);
        } catch (err) {
          setStatus(`Erro ao salvar: ${err.message}`);
        }
      };

      const saveImprovement = async () => {
        if (!currentImprovement || !improvementDirty || currentImprovement.status === 'applied') return;
        setStatus('Salvando respostas da melhoria...');
        try {
          const endpoint = new URL(`/__stdd/api/improvements/${encodeURIComponent(currentImprovement.id)}.json`, apiOrigin());
          const response = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentImprovement)
          });
          const responseText = await response.text();
          let result = {};
          if (responseText.trim()) {
            try {
              result = JSON.parse(responseText);
            } catch (_) {
              throw new Error(`resposta inválida do servidor (HTTP ${response.status})`);
            }
          }
          if (!response.ok) throw new Error(result.error || `falha ao salvar (HTTP ${response.status})`);
          const refreshed = await getJson(`improvements/${encodeURIComponent(currentImprovement.id)}.json`);
          setCurrentImprovement(refreshed);
          setImprovementDirty(false);
          setStatus('Respostas da melhoria salvas separadamente do Draw.');
          const improvements = await getJson('improvements/index.json');
          setImprovementIndex(improvements.improvements || []);
        } catch (err) {
          setStatus(`Erro ao salvar melhoria: ${err.message}`);
        }
      };

      const newDraw = async () => {
        const values = await openFormDialog('Novo Desenho', 'Crie um novo desenho vazio no repositório.', [
          { name: 'title', label: 'Título', value: 'Novo desenho', required: true },
          { name: 'subtitle', label: 'Descrição', value: '', type: 'textarea' },
          { name: 'kind', label: 'Tipo', value: 'feature', options: ['feature', 'flow', 'architecture', 'tradeoff', 'subflow'].map(k => ({ value: k, label: k })) }
        ]);
        if (!values || !values.title.trim()) return;

        const newId = uniqueDrawId(values.title, index);
        const payload = {
          version: 1,
          id: newId,
          title: values.title.trim(),
          subtitle: values.subtitle.trim(),
          kind: values.kind,
          groups: [],
          nodes: [],
          edges: []
        };

        setCurrent(payload);
        setCurrentImprovement(null);
        window.currentDrawId = newId;
        setNodes([]);
        setEdges([]);
        setDirty(true);
        setImprovementDirty(false);
        setIsLibraryOpen(false);
        setStatus('Novo desenho criado. Adicione blocos.');
      };

      const editDrawMetadata = async () => {
        if (!current) return;
        const values = await openFormDialog('Detalhes do Desenho', 'Modifique os detalhes lógicos do cabeçalho.', [
          { name: 'title', label: 'Título', value: current.title || '', required: true },
          { name: 'subtitle', label: 'Descrição', value: current.subtitle || '', type: 'textarea' },
          { name: 'kind', label: 'Tipo', value: current.kind || 'feature', options: ['feature', 'flow', 'architecture', 'tradeoff', 'subflow'].map(k => ({ value: k, label: k })) }
        ]);
        if (!values) return;

        setCurrent(prev => ({ ...prev, ...values }));
        setDirty(true);
      };

      const editEdgeDirect = async (edgeId) => {
        const rfEdge = edges.find(e => e.id === edgeId);
        if (!rfEdge) return;
        const edgeData = rfEdge.data || {};

        const values = await openFormDialog('Editar Conexão', 'Configure as propriedades da relação.', [
          { name: 'label', label: 'Rótulo', value: edgeData.label || '' },
          { name: 'condition', label: 'Condição', value: String(edgeData.condition || 1), options: Object.entries(EDGE_CONDITIONS).map(([v, l]) => ({ value: v, label: l })) }
        ]);
        if (!values) return;

        const condNum = Number(values.condition);
        const updatedEdges = edges.map(e => {
          if (e.id === edgeId) {
            return toReactFlowEdge({ ...edgeData, label: values.label, condition: condNum }, {
              loop: e.type === 'loop',
              sourceHandle: e.sourceHandle,
              targetHandle: e.targetHandle
            });
          }
          return e;
        });
        setEdges(updatedEdges);
        setDirty(true);
      };

      const filteredIndex = index.filter(item =>
        `${item.title} ${item.subtitle} ${item.kind}`.toLowerCase().includes(query.toLowerCase())
      );
      const filteredImprovements = improvementIndex.filter(item =>
        `${item.title} ${item.draw_id} ${item.status}`.toLowerCase().includes(query.toLowerCase())
      );
      const questionsSummary = questionsDialog ? questionCounts(questionsDialog) : null;

      return React.createElement('div', { className: `app ${isLibraryOpen ? 'library-open' : ''}` },

        React.createElement('aside', { className: 'sidebar' },

            React.createElement('div', { className: 'brand-mark' }, 'D'),
            React.createElement('div', null,
              React.createElement('p', { className: 'eyebrow' }, 'STDD · Draw'),
              React.createElement('h1', null, 'Desenhos')
            )
          ),
          React.createElement('p', { className: 'muted sidebar-copy' }, 'Explore fluxos e decisões sem carregar o projeto inteiro.'),
          React.createElement('button', { className: 'new-draw', onClick: newDraw }, '＋ Novo desenho'),
          React.createElement('input', {
            className: 'search',
            placeholder: 'Buscar desenho...',
            value: query,
            onChange: (e) => setQuery(e.target.value)
          }),
          React.createElement('div', { className: 'draw-list' },
            filteredIndex.map(item => React.createElement('button', {
              key: item.id,
              className: `draw-item${current?.id === item.id ? ' active' : ''}`,
              onClick: () => loadDrawing(item.id, { resetNavigation: true })
            },
              React.createElement('strong', null, item.title),
              React.createElement('small', null, `${item.kind} · ${item.node_count} blocos · ${item.edge_count} conexões`)
            ))
          ),
          React.createElement('div', { className: 'improvement-list' },
            React.createElement('div', { className: 'improvement-heading' }, 'Sessões de melhoria'),
            filteredImprovements.length ? filteredImprovements.map(item => React.createElement('button', {
              key: item.id,
              className: `improvement-item${currentImprovement?.id === item.id ? ' active' : ''}`,
              onClick: () => loadImprovement(item.id)
            },
              React.createElement('strong', null, item.title),
              React.createElement('small', null, `${item.draw_id} · ${item.answered_count}/${item.question_count} respostas · ${item.status}`)
            )) : React.createElement('p', { className: 'muted' }, 'Nenhuma sessão criada.')
          )
        ),

        // Workspace
        React.createElement('section', { className: 'workspace' },
          // Toolbar
          React.createElement('div', { className: 'toolbar' },
            React.createElement('div', { className: 'tool-group' },
              React.createElement('button', { onClick: () => setIsLibraryOpen(!isLibraryOpen) }, '☰ Desenhos'),
              React.createElement('button', { disabled: navigation.length === 0, onClick: goBack }, '← Voltar')
            ),
            React.createElement('div', { className: 'title', onDoubleClick: editDrawMetadata },
              current ? `${navigation.join(' › ') ? navigation.join(' › ') + ' › ' : ''}${current.title}` : currentImprovement ? `Melhoria: ${currentImprovement.title}` : 'Nenhum desenho carregado'
            ),
            React.createElement('div', { className: 'tool-group' },
              React.createElement('button', { disabled: !current, onClick: addNode }, '＋ Adicionar bloco'),
              React.createElement('button', { className: 'reorganize', disabled: !current || !nodes.length, onClick: reorganize }, '✦ Reorganizar'),
              React.createElement('button', { disabled: !current || (!selectedNode && !selectedEdge), className: 'danger', onClick: deleteSelection }, '⌫ Excluir'),
              React.createElement('button', { disabled: currentImprovement ? !improvementDirty || currentImprovement.status === 'applied' : !dirty, className: 'primary', onClick: currentImprovement ? saveImprovement : saveDraw },
                (currentImprovement ? improvementDirty : dirty) && React.createElement('span', { className: 'dirty-dot' }),
                '✓ Salvar'
              )
            )
          ),

          // React Flow component
          current ? React.createElement('div', { className: 'react-flow-stage' },
            React.createElement(ReactFlow, {
              nodes: nodes,
              edges: edges,
              onNodesChange: onNodesChange,
              onEdgesChange: onEdgesChange,
              onConnect: onConnect,
              onNodeDragStop: onNodeDragStop,
              nodeTypes: nodeTypes,
              edgeTypes: edgeTypes,
              onNodeClick: (e, node) => { setSelectedNode(node.id); setSelectedEdge(null); },
              onEdgeClick: (e, edge) => { setSelectedEdge(edge.id); setSelectedNode(null); },
              onPaneClick: () => { setSelectedNode(null); setSelectedEdge(null); },
              onEdgeDoubleClick: (e, edge) => editEdgeDirect(edge.id),
              fitView: true
            },
              React.createElement(Background, null),
              React.createElement(Controls, null),
              React.createElement(MiniMap, null)
            )
          ) : currentImprovement ? React.createElement('div', { className: 'improvement-editor' },
            React.createElement('p', { className: 'eyebrow' }, 'STDD · Draw Improve'),
            React.createElement('h2', null, currentImprovement.title),
            React.createElement('p', { className: 'dialog-copy' }, `Sessão associada ao Draw ${currentImprovement.draw_id}. As respostas são salvas separadamente do fluxo.`),
            React.createElement('div', { className: 'improvement-progress' }, `${(currentImprovement.questions || []).filter(question => question.answer !== null && question.answer !== undefined && (typeof question.answer !== 'string' || question.answer.trim())).length}/${(currentImprovement.questions || []).length} respondidas · ${currentImprovement.status}`),
            (currentImprovement.questions || []).map(q => React.createElement('div', { key: q.id, className: 'improvement-question' },
              React.createElement('label', null, `Pergunta ${q.id}`),
              React.createElement('p', null, q.prompt),
              q.type === 'open' ? React.createElement('textarea', {
                disabled: currentImprovement.status === 'applied',
                value: q.answer || '',
                onChange: (e) => window.updateImprovementAnswer(q.id, e.target.value)
              }) : React.createElement('select', {
                disabled: currentImprovement.status === 'applied',
                value: q.answer === null || q.answer === undefined ? '' : String(q.answer),
                onChange: (e) => {
                  const value = e.target.value;
                  const answer = value === '' ? null : q.type === 'boolean' ? value === 'true' : Number(value);
                  window.updateImprovementAnswer(q.id, answer);
                }
              },
                React.createElement('option', { value: '' }, 'Ainda sem resposta'),
                q.type === 'boolean' ? [
                  React.createElement('option', { key: 'true', value: 'true' }, 'Sim'),
                  React.createElement('option', { key: 'false', value: 'false' }, 'Não')
                ] : (q.options || []).map((option, optionIndex) => React.createElement('option', { key: option.id, value: String(option.id) }, `${String.fromCharCode(65 + optionIndex)}. ${option.label}`))
              )
            ))
          ) : React.createElement('div', { className: 'empty-state' }, 'Abra um desenho ou uma sessão de melhoria pela biblioteca.'),

          React.createElement('div', { className: 'canvas-hint' }, 'Arraste blocos e conecte suas portas laterais. Duplo clique no nome ou descrição edita diretamente.'),
          React.createElement('div', { className: 'status' }, status)
        ),

        // Confirm Dialog
        confirmDialog && React.createElement('dialog', { className: 'app-dialog', open: true },
          React.createElement('div', { className: 'dialog-content' },
            React.createElement('p', { className: 'eyebrow' }, 'STDD · Confirmação'),
            React.createElement('h2', null, confirmDialog.title),
            React.createElement('p', { className: 'dialog-copy' }, confirmDialog.copy),
            React.createElement('div', { className: 'dialog-actions' },
              React.createElement('button', { onClick: () => confirmDialog.onConfirm(false) }, 'Cancelar'),
              React.createElement('button', { className: 'danger', onClick: () => confirmDialog.onConfirm(true) }, confirmDialog.submitLabel)
            )
          )
        ),

        // Form Dialog
        formDialog && React.createElement('dialog', { className: 'app-dialog', open: true },
          React.createElement('form', {
            className: 'dialog-content',
            onSubmit: (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              const vals = {};
              formDialog.fields.forEach(f => {
                vals[f.name] = formData.get(f.name);
              });
              formDialog.onSubmit(vals);
            }
          },
            React.createElement('p', { className: 'eyebrow' }, 'STDD · Editor'),
            React.createElement('h2', null, formDialog.title),
            React.createElement('p', { className: 'dialog-copy' }, formDialog.copy),
            React.createElement('div', { className: 'dialog-fields' },
              formDialog.fields.map(f => React.createElement('div', { key: f.name, className: 'editor-field' },
                React.createElement('label', null, f.label),
                f.options ? React.createElement('select', { name: f.name, defaultValue: f.value },
                  f.options.map(opt => React.createElement('option', { key: opt.value, value: opt.value }, opt.label))
                ) : f.type === 'textarea' ? React.createElement('textarea', { name: f.name, defaultValue: f.value }) :
                  React.createElement('input', { name: f.name, type: 'text', defaultValue: f.value, required: f.required })
              ))
            ),
            React.createElement('div', { className: 'dialog-actions' },
              React.createElement('button', { type: 'button', onClick: () => formDialog.onSubmit(null) }, 'Cancelar'),
              React.createElement('button', { className: 'primary', type: 'submit' }, formDialog.submitLabel)
            )
          )
        ),

        // Questions Dialog
        questionsDialog && React.createElement('dialog', { className: 'app-dialog', open: true },
          React.createElement('div', { className: 'dialog-content' },
            React.createElement('p', { className: 'eyebrow' }, 'STDD · Perguntas'),
            React.createElement('h2', null, `Perguntas: ${questionsDialog.label}`),
            React.createElement('div', { className: 'question-summary' },
              React.createElement('span', { className: 'question-count answered' }, questionsSummary.answered),
              React.createElement('span', null, 'respondidas'),
              React.createElement('span', { className: 'question-count unanswered' }, questionsSummary.unanswered),
              React.createElement('span', null, 'sem resposta')
            ),
            React.createElement('div', { className: 'question-list' },
              (questionsDialog.questions || []).map(q => React.createElement('div', { key: q.id, className: 'question-card' },
                React.createElement('label', null, `Pergunta ${q.id}`),
                React.createElement('p', null, q.prompt),
                q.type === 'open' ? React.createElement('textarea', {
                  defaultValue: q.answer || '',
                  onChange: (e) => {
                    const answer = e.target.value;
                    window.updateQuestionAnswer(questionsDialog.id, q.id, answer);
                    setQuestionsDialog(prev => ({
                      ...prev,
                      questions: prev.questions.map(item => item.id === q.id ? { ...item, answer } : item)
                    }));
                    setDirty(true);
                  }
                }) : React.createElement('select', {
                  defaultValue: q.answer === null || q.answer === undefined ? '' : String(q.answer),
                  onChange: (e) => {
                    const val = e.target.value;
                    const answer = val === '' ? null : q.type === 'boolean' ? (val === 'true') : Number(val);
                    window.updateQuestionAnswer(questionsDialog.id, q.id, answer);
                    setQuestionsDialog(prev => ({
                      ...prev,
                      questions: prev.questions.map(item => item.id === q.id ? { ...item, answer } : item)
                    }));
                    setDirty(true);
                  }
                },
                  React.createElement('option', { value: '' }, 'Ainda sem resposta'),
                  q.type === 'boolean' ? [
                    React.createElement('option', { key: 'true', value: 'true' }, 'Sim'),
                    React.createElement('option', { key: 'false', value: 'false' }, 'Não')
                  ] : (q.options || []).map(opt => React.createElement('option', { key: opt.id, value: String(opt.id) }, opt.label))
                )
              ))
            ),
            React.createElement('div', { className: 'dialog-actions' },
              React.createElement('button', { className: 'primary', onClick: () => setQuestionsDialog(null) }, 'Fechar')
            )
          )
        )
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(ReactFlowProvider, null, React.createElement(App, null))
    );
  </script>
