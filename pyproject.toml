[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looper"
version = "0.1.2"
description = "Test-driven harness control for Codex"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
looper = "looper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
looper = ["draw_assets/**/*", "templates/PLAYWRIGHT_GUIDE.md", "templates/agents/*/SKILL.md", "templates/agents/*/agents/*.yaml", "templates/adapters/*.php", "templates/adapters/*.py", "templates/adapters/*.js", "templates/draw/*.html", "templates/draw/*.json", "templates/runs/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
