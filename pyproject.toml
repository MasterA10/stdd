[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stdd"
version = "0.1.1"
description = "Test-driven harness control for Codex"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
stdd = "stdd.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stdd = ["draw_assets/**/*", "templates/agents/*/SKILL.md", "templates/agents/*/agents/*.yaml", "templates/draw/*.html", "templates/draw/*.json", "templates/runs/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
