name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run framework check --format json
      - run: uv run framework security scan --format json
      - run: uv build
