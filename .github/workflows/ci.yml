name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run framework check --format json
      - run: uv run framework security scan --format json
      - run: uv run pytest tests/unit tests/contract tests/integration
      - run: uv run framework learn quiz sync --format json || test $? -eq 0
