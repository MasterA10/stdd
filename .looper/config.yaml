# Extensões consideradas no cálculo de alterações do projeto.
tracked_extensions:
- .bash
- .c
- .cpp
- .cs
- .go
- .h
- .hpp
- .java
- .js
- .jsx
- .kt
- .php
- .py
- .rb
- .rs
- .scala
- .sh
- .swift
- .ts
- .tsx
# Versão do esquema da configuração.
version: 1
# Stack detectada localmente; normalmente atualizada por `looper setup`.
stack:
  # Opção `stack.languages` da configuração.
  languages:
  - typescript
  - python
  # Opção `stack.frameworks` da configuração.
  frameworks:
  - react
  # Opção `stack.test_runners` da configuração.
  test_runners:
  - draw-editor:javascript
  - pytest
  # Opção `stack.evidence` da configuração.
  evidence:
  - pyproject.toml
  # Opção `stack.status` da configuração.
  status: detected
# Orientações persistentes enviadas ao agente por tipo de loop.
instructions:
  # Enviado em todo loop de backend (backlog backend / backlog task --backend).
  backend: |
    Logging transversal obrigatório: registre eventos em todas as etapas, funções públicas, handlers e integrações usando a fachada central de log do projeto. Mantenha rastreabilidade completa (entrada e saída com parâmetros em debug, conclusão de operações em info, erros incondicionais com stack trace cru em error). Preserve o evento bruto no backend, sujeito apenas à redaction cirúrgica de segredos; o frontend pode exibir inicialmente apenas timestamp, evento e status/erro (como 200 ou 400) e abrir os detalhes sob demanda. Não use print ou console.log ad-hoc.
  # Enviado em todo loop de frontend (backlog frontend / backlog task --frontend).
  frontend: ''
  # Enviado em todo loop de alteração (backlog change).
  change: ''
# Revisão automática opcional após tasks concluídas.
review:
  # Ativa a execução automática de revisões.
  enabled: true
  # Agente padrão: `codex`, `claude` ou `antigravity`.
  default_agent: antigravity
  # Nível de reasoning usado quando o agente aceitar essa opção.
  reasoning: high
  # Tempo máximo da revisão em segundos.
  timeout_seconds: 900
  # Prompt base enviado ao agente de revisão.
  standard_prompt: Confira a task aprovada abaixo usando o Draw e os arquivos reais
    do projeto. Não implemente código. Se faltar algo, crie uma change pendente no
    nó exato usando `looper draw change add`; se estiver completa, não crie nenhuma
    change.
  # Define em quais fases e escopos a revisão é acionada.
  triggers:
    # Opção `review.triggers.test` da configuração.
    test:
      # Opção `review.triggers.test.l2` da configuração.
      l2: false
      # Opção `review.triggers.test.l3` da configuração.
      l3: false
      # Opção `review.triggers.test.l2_and_l3` da configuração.
      l2_and_l3: false
      # Opção `review.triggers.test.all` da configuração.
      all: false
    # Opção `review.triggers.implementation` da configuração.
    implementation:
      # Opção `review.triggers.implementation.l2` da configuração.
      l2: false
      # Opção `review.triggers.implementation.l3` da configuração.
      l3: false
      # Opção `review.triggers.implementation.l2_and_l3` da configuração.
      l2_and_l3: true
      # Opção `review.triggers.implementation.all` da configuração.
      all: false
    # Opção `review.triggers.change` da configuração.
    change:
      # Opção `review.triggers.change.l2` da configuração.
      l2: false
      # Opção `review.triggers.change.l3` da configuração.
      l3: false
      # Opção `review.triggers.change.l2_and_l3` da configuração.
      l2_and_l3: false
      # Opção `review.triggers.change.all` da configuração.
      all: false
  # Comandos locais disponíveis para cada agente.
  agents:
    # Opção `review.agents.codex` da configuração.
    codex:
      # Modelo usado pelo agente Codex.
      model: ''
      # Opção `review.agents.codex.command` da configuração.
      command:
      - codex
      - exec
      - --model
      - '{model}'
      - -c
      - model_reasoning_effort={reasoning}
      - '{prompt}'
    # Opção `review.agents.claude` da configuração.
    claude:
      # Modelo usado pelo agente Claude.
      model: ''
      # Opção `review.agents.claude.command` da configuração.
      command:
      - claude
      - -p
      - --model
      - '{model}'
      - '{prompt}'
    # Opção `review.agents.antigravity` da configuração.
    antigravity:
      # Modelo usado pelo agente Antigravity.
      model: ''
      # Opção `review.agents.antigravity.command` da configuração.
      command:
      - agy
      - -p
      - '{prompt}'
      - --model
      - '{model}'
