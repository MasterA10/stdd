# Extensões consideradas no cálculo de alterações do projeto.
tracked_extensions:
- .bash
- .c
- .cpp
- .cs
- .go
- .h
- .hpp
- .java
- .js
- .jsx
- .kt
- .php
- .py
- .rb
- .rs
- .scala
- .sh
- .swift
- .ts
- .tsx
# Versão do esquema da configuração.
version: 1
# Stack detectada localmente; normalmente atualizada por `looper setup`.
stack:
  # Configuração de languages.
  languages:
  - typescript
  - python
  # Configuração de frameworks.
  frameworks:
  - react
  # Configuração de test runners.
  test_runners:
  - draw-editor:javascript
  - pytest
  # Configuração de evidence.
  evidence:
  - pyproject.toml
  # Configuração de status.
  status: detected
# Orientações persistentes enviadas ao agente por tipo de loop.
instructions:
  # Enviado em todo loop de backend (backlog backend / backlog task --backend).
  backend: 'Logging transversal obrigatório: registre eventos em todas as etapas,
    funções públicas, handlers e integrações usando a fachada central de log do projeto.
    Mantenha rastreabilidade completa (entrada e saída com parâmetros em debug, conclusão
    de operações em info, erros incondicionais com stack trace cru em error). Preserve
    o evento bruto no backend, sujeito apenas à redaction cirúrgica de segredos; o
    frontend pode exibir inicialmente apenas timestamp, evento e status/erro (como
    200 ou 400) e abrir os detalhes sob demanda. Não use print ou console.log ad-hoc.

    '
  # Enviado em todo loop de frontend (backlog frontend / backlog task --frontend).
  frontend: ''
  # Enviado em todo loop de alteração (backlog change).
  change: ''
# Revisão automática opcional após tasks concluídas.
review:
  # Ativa a execução automática de revisões.
  enabled: true
  # Agente de revisão padrão: `codex`; outros só são usados quando configurados explicitamente.
  default_agent: agy
  # Configuração de interval tasks.
  interval_tasks: 1
  # Configuração de execution mode.
  execution_mode: tmux
  # Configuração de completed since last review.
  completed_since_last_review: 0
  # Nível de reasoning usado quando o agente aceitar essa opção.
  reasoning: high
  # Tempo máximo da revisão em segundos.
  timeout_seconds: 900
  # Prompt base enviado ao agente de revisão.
  standard_prompt: Confira a task aprovada abaixo usando o Draw e os arquivos reais
    do projeto. Não implemente código. Se faltar algo, crie uma change pendente no
    nó exato usando `looper draw change add`; se estiver completa, não crie nenhuma
    change.
  # Define em quais fases e escopos a revisão é acionada.
  triggers:
    # Configuração de test.
    test:
      # Configuração de l2.
      l2: false
      # Configuração de l3.
      l3: false
      # Configuração de l2 and l3.
      l2_and_l3: false
      # Configuração de all.
      all: false
    # Configuração de implementation.
    implementation:
      # Configuração de l2.
      l2: false
      # Configuração de l3.
      l3: false
      # Configuração de l2 and l3.
      l2_and_l3: true
      # Configuração de all.
      all: false
    # Configuração de change.
    change:
      # Configuração de l2.
      l2: false
      # Configuração de l3.
      l3: false
      # Configuração de l2 and l3.
      l2_and_l3: false
      # Configuração de all.
      all: false
  # Comandos locais disponíveis para cada agente.
  agents:
    # Configuração de codex.
    codex:
      # Configuração de model.
      model: ''
      # Configuração de command.
      command:
      - codex
      - exec
      - --model
      - '{model}'
      - -c
      - model_reasoning_effort={reasoning}
      - '{prompt}'
    # Configuração de agy.
    agy:
      # Configuração de model.
      model: ''
      # Configuração de command.
      command:
      - agy
      - -p
      - '{prompt}'
      - --dangerously-skip-permissions
      - --effort
      - '{reasoning}'
      - --model
      - '{model}'
    # Configuração de claude.
    claude:
      # Configuração de model.
      model: ''
      # Configuração de command.
      command:
      - claude
      - -p
      - --model
      - '{model}'
      - '{prompt}'
    # Configuração de antigravity.
    antigravity:
      # Configuração de model.
      model: ''
      # Configuração de command.
      command:
      - agy
      - -p
      - '{prompt}'
      - --model
      - '{model}'
