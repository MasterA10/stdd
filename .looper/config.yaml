# Comandos de teste executados por `looper test`. Cada item precisa de name e command.
test_commands:
# Configuração de - name.
- name: all
  # Configuração de command.
  command:
  - .venv/bin/python3.14
  - -m
  - pytest
# Validação automática da documentação dos testes.
contract:
  # Ativa a validação automática da documentação dos testes.
  enabled: true
  # Linguagem cujo contrato será analisado.
  code_language: python
  # Idioma esperado nas descrições dos testes.
  description_language: pt-BR
  # Limite de caracteres para descrições curtas.
  short_description_max_chars: 160
# Ordem, lotes e comportamento dos loops de desenvolvimento.
backlog:
  # Habilita a task inicial de preparação do projeto.
  bootstrap_task: true
  # Quantidade de nós L4 entregues junto com o pai L3; padrão 3.
  l4_group_size: 3
  # Configuração de l2 verification interval.
  l2_verification_interval: 1
  # Cria uma verificação final após as tasks do backlog.
  final_verification_task: true
  # Ordem de desenvolvimento: `sequential` intercala telas e backend; `separated` conclui todas as telas antes do backend.
  development_mode: separated
  # Cria e libera testes antes de implementar.
  test_loop_enabled: false
  # Tamanho de cada entrega: `task` (uma por vez) ou `node` (nó completo com subfluxos).
  task_delivery_scope: task
  # Sequência e opções do loop de testes.
  test_loop:
    # Configuração de mode.
    mode: task_order
    # Configuração de batch size.
    batch_size: 1
  # Preset e opções do loop de implementação.
  implementation_loop:
    # Configuração de mode.
    mode: task_order
    # Configuração de batch size.
    batch_size: 1
  # O que será testado: `l2` (telas), `l3` (backend) ou `both` (ambos).
  test_scope: both
# Análise de qualidade: complexidade, dependências e estrutura do código.
static_analysis:
  # Ativa a análise de qualidade do código; requer adaptador configurado.
  enabled: true
  # Comando do adaptador; use uma lista de argumentos.
  adapter_command:
  - python3
  - .looper/adapters/static_adapter.py
  # Versão do contrato retornado pelo adaptador.
  contract_version: '1'
  # Permite que credenciais marcadas em fixtures sejam apenas warnings.
  allow_marked_test_credentials: true
  # Limites de qualidade que geram warnings ou bloqueios.
  quality:
    # Configuração de functions.
    functions:
      # Configuração de max lines.
      max_lines:
        # Configuração de warning.
        warning: 40
        # Configuração de blocking.
        blocking: 100
      # Configuração de max complexity.
      max_complexity:
        # Configuração de warning.
        warning: 10
        # Configuração de blocking.
        blocking: 25
    # Configuração de tests.
    tests:
      # Configuração de max lines.
      max_lines:
        # Configuração de warning.
        warning: 80
        # Configuração de blocking.
        blocking: 160
  # Exceções temporárias e rastreáveis para achados específicos.
  exceptions:
  # Configuração de - rule.
  - rule: deep_nesting
    # Configuração de symbol id.
    symbol_id: src/looper/core.py:looper.core.get_incremental_diff_stats
    # Configuração de action.
    action: warning
    # Configuração de reason.
    reason: Achado preexistente; refatoração dedicada está fora deste trabalho.
    # Configuração de expires.
    expires: '2027-01-01'
