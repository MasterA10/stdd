# Suítes executadas por `looper test`; cada item aceita name, command e timeout.
test_commands:
# Opção `- name` da configuração.
- name: all
  # Opção `- name.command` da configuração.
  command:
  - .venv/bin/python3.14
  - -m
  - pytest
# Regras de documentação e contrato dos testes.
contract:
  # Ativa ou desativa a validação de contrato.
  enabled: true
  # Linguagem cujo contrato será analisado.
  code_language: python
  # Idioma esperado nas descrições dos testes.
  description_language: pt-BR
  # Limite de caracteres para descrições curtas.
  short_description_max_chars: 160
# Ordem, lotes e comportamento dos loops do backlog.
backlog:
  # Habilita a task inicial de preparação do projeto.
  bootstrap_task: true
  # Quantidade de nós L4 entregues junto com cada pai L3.
  l4_group_size: 3
  # Opção `backlog.l2_verification_interval` da configuração.
  l2_verification_interval: 1
  # Cria uma verificação final após todas as tasks do backlog terminarem
  final_verification_task: true
  # `sequential` mistura fases; `separated` conclui L2 antes de L3.
  development_mode: separated
# Configuração do adaptador e dos gates de análise estática.
static_analysis:
  # Ativa ou desativa a análise estática.
  enabled: true
  # Comando do adaptador; use uma lista de argumentos.
  adapter_command:
  - python3
  - .looper/adapters/static_adapter.py
  # Versão do contrato retornado pelo adaptador.
  contract_version: '1'
  # Permite que credenciais marcadas em fixtures sejam apenas warnings.
  allow_marked_test_credentials: true
  # Limites de qualidade que geram warnings ou bloqueios.
  quality:
    # Opção `static_analysis.quality.functions` da configuração.
    functions:
      # Opção `static_analysis.quality.functions.max_lines` da configuração.
      max_lines:
        # Opção `static_analysis.quality.functions.max_lines.warning` da configuração.
        warning: 40
        # Opção `static_analysis.quality.functions.max_lines.blocking` da configuração.
        blocking: 100
      # Opção `static_analysis.quality.functions.max_complexity` da configuração.
      max_complexity:
        # Opção `static_analysis.quality.functions.max_complexity.warning` da configuração.
        warning: 10
        # Opção `static_analysis.quality.functions.max_complexity.blocking` da configuração.
        blocking: 25
    # Opção `static_analysis.quality.tests` da configuração.
    tests:
      # Opção `static_analysis.quality.tests.max_lines` da configuração.
      max_lines:
        # Opção `static_analysis.quality.tests.max_lines.warning` da configuração.
        warning: 80
        # Opção `static_analysis.quality.tests.max_lines.blocking` da configuração.
        blocking: 160
  # Exceções temporárias e rastreáveis para achados específicos.
  exceptions:
  # Opção `static_analysis.- rule` da configuração.
  - rule: deep_nesting
    # Opção `static_analysis.- rule.symbol_id` da configuração.
    symbol_id: src/looper/core.py:looper.core.get_incremental_diff_stats
    # Opção `static_analysis.- rule.action` da configuração.
    action: warning
    # Opção `static_analysis.- rule.reason` da configuração.
    reason: Achado preexistente; refatoração dedicada está fora deste trabalho.
    # Opção `static_analysis.- rule.expires` da configuração.
    expires: '2027-01-01'
  # Opção `static_analysis.- rule` da configuração.
